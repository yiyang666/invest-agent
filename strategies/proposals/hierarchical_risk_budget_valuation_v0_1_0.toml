# Copy through scripts/proposal.py; do not edit this template for one strategy.
schema_version = 1
strategy_id = "hierarchical_risk_budget_valuation"
strategy_version = "0.1.0"
title = "分层风险预算与估值水位组合策略"
status = "frozen" # frozen before discovery-backed implementation and any performance run
mode = "research_only"
hypothesis = "在相同逐月现金流下，分层风险预算、估值归一化定投和有上限的回撤加仓，可能在组合压力不突破20%风险线的前提下提高XIRR或改善回撤后的资金使用效率。"
allocation_anchor = "allocation_anchor_631"
comparison_benchmark = "dca_baseline@1.5.0"
scope = "new_money_only"
allow_selling = false
allow_leverage = false

[theory_freeze]
status = "frozen"
confirmed_date = "2026-08-26"
confirmed_scope = "allocation_hierarchy_signal_thresholds_cashflow_identity_and_daily_monthly_quarterly_semantics"
proposal_status_reason = "full proposal remains draft until acceptance criteria and discovery evidence are frozen"
parameter_change_rule = "material_changes_create_0_2_0_and_reset_prospective_observation"

[capital]
monthly_committed_cny = 3000
monthly_discretionary_max_cny = 2000
monthly_hard_cap_cny = 5000
uninvested_cash_action = "remain_cash"

[stable]
