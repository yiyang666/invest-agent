<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="color-scheme" content="light dark" />
  <title>同花顺基金Skill · 设备注册与授权</title>
  <style>
    :root {
      --bg: #0b0e1a;
      --bg-2: #111527;
      --surface: #161a2e;
      --surface-2: #1c2038;
      --border: #252a45;
      --text: #e8eaf2;
      --text-2: #8891b0;
      --primary: #e8a838;
      --primary-dim: rgba(232, 168, 56, 0.12);
      --mint: #60c9a7;
      --mint-dim: rgba(96, 201, 167, 0.12);
      --shadow: 0 8px 48px rgba(0, 0, 0, 0.5);
    }
    @media (prefers-color-scheme: light) {
      :root {
        --bg: #eef0f7;
        --bg-2: #e4e7f2;
        --surface: #ffffff;
        --surface-2: #f5f7fc;
        --border: #d0d4e8;
        --text: #1a1d2e;
        --text-2: #5c6480;
        --primary: #c4850e;
        --primary-dim: rgba(196, 133, 14, 0.08);
        --mint: #2a9d6e;
        --mint-dim: rgba(42, 157, 110, 0.08);
        --shadow: 0 8px 48px rgba(20, 24, 52, 0.12);
      }
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      padding: 0;
      background: var(--bg);
      color: var(--text);
      font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans SC", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 16px;
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
      min-height: 100vh;
    }

    /* ── Desktop layout ── */
    .page {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px 24px;
    }
    .card {
      display: grid;
      grid-template-columns: 380px 1fr;
      gap: 0;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 24px;
      box-shadow: var(--shadow);
      overflow: hidden;
      max-width: 860px;
      width: 100%;
    }

    /* ── Left panel: QR ── */
    .panel-qr {
      padding: 32px 36px;
      background: var(--bg-2);
      display: flex;
      flex-direction: column;
      align-items: center;
      border-right: 1px solid var(--border);
    }
    .panel-qr .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 24px;
      align-self: flex-start;
    }
    .brand-icon {
      width: 36px;
      height: 36px;
      background: var(--primary-dim);
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .brand-icon svg {
      width: 20px;
      height: 20px;
      color: var(--primary);
    }
    .brand-name {
      font-size: 14px;
      font-weight: 600;
      color: var(--text);
      letter-spacing: 0.5px;
    }
    .qr-anchor {
      position: relative;
      margin-bottom: 16px;
    }
    .qr-ring {
      width: 220px;
      height: 220px;
      border-radius: 50%;
      background: conic-gradient(var(--primary) 0deg, var(--border) 80deg, transparent 80deg);
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      animation: spin 10s linear infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    .qr-ring::before {
      content: "";
      position: absolute;
      inset: 10px;
      border-radius: 50%;
      background: var(--bg-2);
    }
    .qr-inner {
      position: relative;
      z-index: 1;
      background: var(--surface);
      border-radius: 14px;
      padding: 10px;
      box-shadow: 0 4px 24px rgba(0,0,0,0.3);
    }
    .qr-inner img {
      width: 168px;
      height: 168px;
      display: block;
      image-rendering: pixelated;
      border-radius: 8px;
    }
    .status-dot {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 12px;
      height: 12px;
      background: var(--primary);
      border-radius: 50%;
      box-shadow: 0 0 0 4px var(--bg-2), 0 0 16px var(--primary);
      animation: pulse 2s ease-in-out infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }
    .hint-bar {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 18px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 100px;
      font-size: 13px;
      color: var(--text-2);
    }
    .hint-bar .dot {
      width: 6px;
      height: 6px;
      background: var(--mint);
      border-radius: 50%;
      flex-shrink: 0;
      animation: blink 1.5s ease-in-out infinite;
    }
    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.2; }
    }
    .scan-tip {
      margin-top: 14px;
      font-size: 14px;
      font-weight: 500;
      color: var(--text);
      letter-spacing: 0.5px;
    }

    /* ── Right panel: Steps ── */
    .panel-steps {
      padding: 32px 40px;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }
    .panel-steps .header {
      margin-bottom: 24px;
    }
    .panel-steps h1 {
      margin: 0 0 8px;
      font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      font-size: 32px;
      font-weight: 700;
      color: var(--text);
      letter-spacing: 1px;
    }
    .panel-steps .subtitle {
      margin: 0;
      font-size: 15px;
      color: var(--text-2);
    }
    .steps {
      display: flex;
      flex-direction: column;
      gap: 0;
    }
    .step {
      display: flex;
      align-items: flex-start;
      gap: 16px;
      padding: 14px 0;
      border-bottom: 1px solid var(--border);
    }
    .step:last-child {
      border-bottom: none;
      padding-bottom: 0;
    }
    .step:first-child {
      padding-top: 0;
    }
    .step-num {
      width: 32px;
      height: 32px;
      background: var(--primary-dim);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 13px;
      font-weight: 700;
      color: var(--primary);
      flex-shrink: 0;
    }
    .step[data-done="true"] .step-num {
      background: var(--mint-dim);
      color: var(--mint);
    }
    .step-body {
      flex: 1;
    }
    .step-body p {
      margin: 0 0 4px;
      font-size: 15px;
      color: var(--text);
      line-height: 1.5;
    }
    .step-body small {
      display: block;
      font-size: 12px;
      color: var(--text-2);
      line-height: 1.4;
    }
    .step-body strong {
      color: var(--primary);
      font-weight: 600;
    }
    .step-body code {
      padding: 2px 7px;
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: 4px;
      font-family: ui-monospace, "SF Mono", Consolas, monospace;
      font-size: 12px;
      color: var(--text);
    }

    /* ── Footer ── */
    footer {
      margin-top: 20px;
      padding-top: 20px;
      border-top: 1px solid var(--border);
      color: var(--text-2);
      font-size: 12px;
      letter-spacing: 0.5px;
    }

    /* ── Mobile fallback ── */
    @media (max-width: 768px) {
      .page {
        padding: 0;
        min-height: auto;
        align-items: flex-start;
      }
      .card {
        grid-template-columns: 1fr;
        border-radius: 0;
        border: none;
        min-height: 100vh;
      }
      .panel-qr {
        border-right: none;
        border-bottom: 1px solid var(--border);
        padding: 32px 24px 24px;
        flex-direction: column;
        align-items: center;
      }
      .panel-qr .brand {
        align-self: center;
        margin-bottom: 24px;
      }
      .qr-ring {
        width: 180px;
        height: 180px;
      }
      .qr-ring::before {
        inset: 8px;
      }
      .qr-inner img {
        width: 140px;
        height: 140px;
      }
      .panel-steps {
        padding: 24px 20px;
      }
      .panel-steps h1 {
        font-size: 24px;
      }
      .step {
        padding: 14px 0;
      }
    }
    @media (prefers-reduced-motion: reduce) {
      .qr-ring { animation: none; }
      .status-dot { animation: none; }

    }
  </style>
</head>
<body>
  <div class="page">
    <div class="card">

      <div class="panel-qr">
        <div class="brand">
          <div class="brand-icon">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" d="M10.5 1.5H8.25A2.25 2.25 0 0 0 6 3.75v16.5a2.25 2.25 0 0 0 2.25 2.25h7.5A2.25 2.25 0 0 0 18 20.25V3.75a2.25 2.25 0 0 0-2.25-2.25H13.5m-3 0V3h3V1.5m-3 0h3m-3 18.75h3M9.75 6h7.5M9.75 9h7.5M9.75 12h4.5" />
            </svg>
          </div>
          <span class="brand-name">同花顺基金Skill</span>
        </div>

        <div class="qr-anchor">
          <div class="qr-ring">
            <div class="qr-inner">
              <img src="init-qrcode.png" alt="设备注册二维码" />
            </div>
          </div>
          <div class="status-dot" aria-hidden="true"></div>
        </div>

        <p class="scan-tip">用同花顺 App 扫一扫此码</p>
      </div>

      <div class="panel-steps">
        <div class="header">
          <h1>设备注册</h1>
          <p class="subtitle">扫码连接同花顺账号，完成授权绑定</p>
        </div>

        <div class="steps">
          <div class="step" data-done="false">
            <div class="step-num">1</div>
            <div class="step-body">
              <p>扫码后点击<strong>「复制提示词」</strong></p>
              <small>进入基金Skill授权页</small>
            </div>
          </div>
          <div class="step" data-done="false">
            <div class="step-num">2</div>
            <div class="step-body">
              <p>完成风险评测 <small>（如系统提示）</small></p>
            </div>
          </div>
          <div class="step" data-done="false">
            <div class="step-num">3</div>
            <div class="step-body">
              <p>将 <code>initToken</code> 粘贴到聊天框</p>
              <small>发送后等待初始化完成</small>
            </div>
          </div>
          <div class="step" data-done="false">
            <div class="step-num">4</div>
            <div class="step-body">
              <p>在同花顺App内<strong>「确认授权」</strong></p>
              <small>设备管理 → 基金Skill</small>
            </div>
          </div>
        </div>

        <footer>thsfund · 设备注册</footer>
      </div>

    </div>
  </div>
</body>
</html>
